# Optional one-shot CLI container. No HTTP API or health claim.
services:
  contextcanon-api:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ../../:/app:ro
      - contextcanon-data:/app/data
    environment:
      PYTHONPATH: /app/packages
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "contextcanon_cli", "doctor"]
volumes:
  contextcanon-data:
